name: Publish container image

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # No dependencies, so there is nothing to install and no lockfile to cache.
      - run: npm test

  publish:
    name: Build and publish
    needs: test
    runs-on: ubuntu-latest
    # Pull requests are built to prove the Dockerfile still works, but nothing
    # from a PR is published.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      # arm64 is emulated. The image only copies files, so this costs seconds
      # and means the same artifact runs on a Pi as on the amd64 VM.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the published image
        run: |
          docker run -d --name smoke \
            -e TZ=Europe/Copenhagen \
            -p 18080:8080 ${{ env.IMAGE }}:sha-${{ github.sha }}
          for i in $(seq 1 20); do
            if curl -fsS localhost:18080/health > /dev/null; then
              echo "health endpoint answered"
              curl -fsS localhost:18080/api/status
              docker rm -f smoke
              exit 0
            fi
            sleep 1
          done
          echo "image did not become healthy"
          docker logs smoke
          exit 1

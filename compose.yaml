# Deployment compose file. It pulls a published image - there is deliberately
# no `build:` here, so a target host needs nothing but Docker, this file and
# a .env. To build from a source checkout instead, see compose.build.yaml.
services:
  solar:
    # Pin to a release tag (e.g. :3.0.0) if you would rather decide when to
    # move. `latest` tracks the master branch.
    image: ghcr.io/emilbm/involar-monitor:latest
    container_name: involar-monitor
    restart: unless-stopped
    env_file: .env

    ports:
      # The Egate has involar.com:1020 hardcoded, so the host must answer on the
      # well-known ports. Inside the container we listen high and unprivileged.
      - "1020:11020"
      - "9800:19800"
      # The dashboard. It is unauthenticated - keep it on the LAN.
      - "8080:8080"

    volumes:
      # Holds solar.db. This is the only thing worth backing up.
      - solar-data:/app/data

    # Without this a long-running container can quietly fill the VM's disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

volumes:
  solar-data:
